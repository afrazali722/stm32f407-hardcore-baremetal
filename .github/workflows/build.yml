name: Cortex-M4 firmware compile
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Arm GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make
      - name: Compile firmware
        run: make
      - name: Upload linked firmware
        uses: actions/upload-artifact@v4
        with:
          name: stm32f407-baremetal
          path: |
            build/*.elf
            build/*.bin
            build/*.map
